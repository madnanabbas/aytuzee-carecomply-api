name: Deploy CareComply - Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carecomply-production
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "24.15.0"
  SOLUTION_FILE: "CareComply.slnx"
  API_PROJECT: "src/CareComply.Api/CareComply.Api.csproj"
  PUBLISH_DIR: "${{ github.workspace }}/publish"
  AZURE_WEBAPP_NAME: "aytuzee"

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout API repository
        uses: actions/checkout@v4

      - name: Checkout Angular repository
        uses: actions/checkout@v4
        with:
          repository: madnanabbas/aytuzee-carecomply
          ref: main
          token: ${{ secrets.CARECOMPLY_FRONTEND_READ_TOKEN }}
          path: frontend
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Angular dependencies
        working-directory: frontend
        run: npm ci

      - name: Check Angular formatting
        working-directory: frontend
        run: npm run format:check

      - name: Test Angular
        working-directory: frontend
        run: npm test -- --watch=false

      - name: Configure same-origin production API
        working-directory: frontend
        run: |
          mkdir -p public/config
          cat > public/config/app-config.json <<'EOF'
          {
            "apiBaseUrl": "/api",
            "postalLookupBaseUrl": "https://api.zippopotam.us",
            "geographyBaseUrl": "https://countriesnow.space/api/v0.1"
          }
          EOF

      - name: Build Angular
        working-directory: frontend
        run: npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore .NET dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build .NET solution
        run: >-
          dotnet build ${{ env.SOLUTION_FILE }}
          --configuration Release
          --no-restore

      - name: Test .NET solution
        run: >-
          dotnet test ${{ env.SOLUTION_FILE }}
          --configuration Release
          --no-build
          --logger "console;verbosity=normal"

      - name: Publish API
        run: >-
          dotnet publish ${{ env.API_PROJECT }}
          --configuration Release
          --no-build
          --output "${{ env.PUBLISH_DIR }}"

      - name: Add Angular application to publish output
        run: |
          mkdir -p "${{ env.PUBLISH_DIR }}/wwwroot"
          cp -R frontend/dist/care-comply/browser/. "${{ env.PUBLISH_DIR }}/wwwroot/"

          test -f "${{ env.PUBLISH_DIR }}/wwwroot/index.html"
          test -f "${{ env.PUBLISH_DIR }}/wwwroot/staticwebapp.config.json"
          test -f "${{ env.PUBLISH_DIR }}/wwwroot/config/app-config.json"
          grep -q '"apiBaseUrl": "/api"' "${{ env.PUBLISH_DIR }}/wwwroot/config/app-config.json"

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: carecomply-production-${{ github.sha }}
          path: ${{ env.PUBLISH_DIR }}
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Azure Web App
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download production artifact
        uses: actions/download-artifact@v4
        with:
          name: carecomply-production-${{ github.sha }}
          path: publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: publish

      - name: Logout from Azure
        if: always()
        run: az logout
