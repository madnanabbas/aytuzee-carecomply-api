name: Deploy CareComply - Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carecomply-production
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  SOLUTION_FILE: "CareComply.slnx"
  API_PROJECT: "src/CareComply.Api/CareComply.Api.csproj"
  PUBLISH_DIR: "${{ github.workspace }}/publish"
  AZURE_WEBAPP_NAME: "aytuzee"

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout API repository
        uses: actions/checkout@v4

      - name: Show GitHub repository information
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Repository ID: ${{ github.repository_id }}"
          echo "Owner ID: ${{ github.repository_owner_id }}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore .NET dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build .NET solution
        run: >-
          dotnet build ${{ env.SOLUTION_FILE }}
          --configuration Release
          --no-restore

      - name: Test .NET solution
        run: >-
          dotnet test ${{ env.SOLUTION_FILE }}
          --configuration Release
          --no-build
          --logger "console;verbosity=normal"

      - name: Publish API
        run: >-
          dotnet publish ${{ env.API_PROJECT }}
          --configuration Release
          --no-build
          --output "${{ env.PUBLISH_DIR }}"

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: carecomply-production-${{ github.sha }}
          path: ${{ env.PUBLISH_DIR }}
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Azure Web App
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download production artifact
        uses: actions/download-artifact@v4
        with:
          name: carecomply-production-${{ github.sha }}
          path: publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure subscription and Web App
        run: |
          echo "Current Azure subscription:"
          az account show \
            --query "{name:name,id:id,tenantId:tenantId}" \
            --output table

          echo ""
          echo "Visible Azure Web Apps:"
          az webapp list \
            --query "[].{name:name,resourceGroup:resourceGroup,state:state,defaultHostName:defaultHostName}" \
            --output table

          echo ""
          echo "Checking target Web App: ${{ env.AZURE_WEBAPP_NAME }}"

          APP_COUNT=$(az webapp list \
            --query "[?name=='${{ env.AZURE_WEBAPP_NAME }}'] | length(@)" \
            --output tsv)

          if [ "$APP_COUNT" = "0" ]; then
            echo "ERROR: Web App '${{ env.AZURE_WEBAPP_NAME }}' is not visible in the logged-in subscription."
            echo "Check AZURE_SUBSCRIPTION_ID and the service principal RBAC permissions."
            exit 1
          fi

          echo "Web App '${{ env.AZURE_WEBAPP_NAME }}' found."

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: publish

      - name: Logout from Azure
        if: always()
        run: az logout