name: Deploy CareComply API - Staging

on:
  push:
    branches:
      - staging

  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '24.15.0'
  SOLUTION_FILE: 'CareComply.slnx'
  API_PROJECT: 'src/CareComply.Api/CareComply.Api.csproj'
  PUBLISH_DIR: '${{ github.workspace }}/publish'
  AZURE_WEBAPP_NAME: 'aytuzee-carecomply'

jobs:
  build_test_deploy:
    name: Build, Test and Deploy
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------
      # Checkout
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # Checkout the private Angular staging repository
      # -------------------------------------------------------
      - name: Checkout Angular staging repository
        uses: actions/checkout@v4
        with:
          repository: madnanabbas/aytuzee-carecomply
          ref: staging
          token: ${{ secrets.CARECOMPLY_FRONTEND_READ_TOKEN }}
          path: frontend
          persist-credentials: false

      # -------------------------------------------------------
      # Build Angular for same-origin App Service hosting
      # -------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Angular dependencies
        working-directory: frontend
        run: npm ci

      - name: Configure same-origin staging API
        working-directory: frontend
        run: |
          mkdir -p public/config
          cat > public/config/app-config.json <<'EOF'
          {
            "apiBaseUrl": "/api"
          }
          EOF

      - name: Build Angular
        working-directory: frontend
        run: npm run build

      # -------------------------------------------------------
      # Setup .NET 10
      # -------------------------------------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # -------------------------------------------------------
      # Restore repository-local dotnet tools
      # -------------------------------------------------------
      - name: Restore .NET tools
        run: dotnet tool restore

      # -------------------------------------------------------
      # Restore NuGet packages
      # -------------------------------------------------------
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      # -------------------------------------------------------
      # Release build
      # -------------------------------------------------------
      - name: Build
        run: |
          dotnet build ${{ env.SOLUTION_FILE }} \
            --configuration Release \
            --no-restore

      # -------------------------------------------------------
      # Application tests
      # -------------------------------------------------------
      - name: Test Application
        run: |
          dotnet test tests/CareComply.Application.Tests/CareComply.Application.Tests.csproj \
            --configuration Release \
            --no-build \
            --logger "console;verbosity=normal"
 
      # -------------------------------------------------------
      # API integration tests
      # -------------------------------------------------------
      - name: Test API Integration
        run: |
          dotnet test tests/CareComply.Api.IntegrationTests/CareComply.Api.IntegrationTests.csproj \
            --configuration Release \
            --no-build \
            --logger "console;verbosity=normal"

      # -------------------------------------------------------
      # Domain tests
      # -------------------------------------------------------
      - name: Test Domain
        run: |
          dotnet test tests/CareComply.Domain.Tests/CareComply.Domain.Tests.csproj \
            --configuration Release \
            --no-build \
            --logger "console;verbosity=normal"

      # -------------------------------------------------------
      # Publish API
      # -------------------------------------------------------
      - name: Publish API
        run: |
          dotnet publish ${{ env.API_PROJECT }} \
            --configuration Release \
            --no-build \
            --output "${{ env.PUBLISH_DIR }}"

      # -------------------------------------------------------
      # Add Angular to the API publish artifact
      # -------------------------------------------------------
      - name: Add Angular application to API publish output
        run: |
          mkdir -p "${{ env.PUBLISH_DIR }}/wwwroot"
          cp -R frontend/dist/care-comply/browser/. "${{ env.PUBLISH_DIR }}/wwwroot/"

          test -f "${{ env.PUBLISH_DIR }}/wwwroot/index.html"
          test -f "${{ env.PUBLISH_DIR }}/wwwroot/staticwebapp.config.json"
          test -f "${{ env.PUBLISH_DIR }}/wwwroot/config/app-config.json"

          grep -q '"apiBaseUrl": "/api"' \
            "${{ env.PUBLISH_DIR }}/wwwroot/config/app-config.json"

      # -------------------------------------------------------
      # Deploy to Azure App Service
      # -------------------------------------------------------
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_DIR }}
